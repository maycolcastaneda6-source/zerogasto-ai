<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroGasto AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col">

    <header class="bg-green-600 p-4 text-white shadow-lg text-center">
        <h1 class="text-xl font-bold">ZeroGasto AI 2026</h1>
    </header>

    <main id="chatWindow" class="flex-1 p-4 overflow-y-auto space-y-4 max-w-2xl mx-auto w-full"></main>

    <footer class="p-4 bg-white border-t">
        <div class="max-w-2xl mx-auto flex gap-2">
            <input type="text" id="userInput" placeholder="Escribe aquí..." class="flex-1 border rounded-lg p-2 outline-none">
            <button id="sendBtn" class="bg-green-600 text-white px-4 py-2 rounded-lg">Enviar</button>
        </div>
    </footer>

    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // 1. PEGA AQUÍ TU NUEVA CLAVE RECIÉN CREADA
        const API_KEY = "AIzaSyBvhqt2nfsZZABHyM9tfMge61LCzV6MvDw"; 
        
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        const chatWindow = document.getElementById('chatWindow');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, isUser = false) {
            const div = document.createElement('div');
            div.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            div.innerHTML = `<div class="${isUser ? 'bg-green-600 text-white' : 'bg-white text-slate-800'} p-3 rounded-lg shadow-sm max-w-[80%]">${text}</div>`;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Mensaje de prueba inicial
        addMessage("¡Sistema listo! Prueba enviando un mensaje.");

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, true);
            userInput.value = '';

            try {
                const result = await model.generateContent(text);
                const response = await result.response;
                addMessage(response.text());
            } catch (e) {
                console.error(e);
                addMessage("Error de conexión. Revisa la consola (F12).");
            }
        }

        sendBtn.onclick = handleSend;
        userInput.onkeypress = (e) => { if(e.key === 'Enter') handleSend(); };
    </script>
</body>
</html>
